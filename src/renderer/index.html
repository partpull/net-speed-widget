<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>网速</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="widget" class="widget is-idle" role="status" aria-live="polite">
      <div class="metric metric--down">
        <span class="metric__icon" aria-hidden="true">↓</span>
        <span class="metric__value" id="down">--</span>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <div class="metric metric--up">
        <span class="metric__icon" aria-hidden="true">↑</span>
        <span class="metric__value" id="up">--</span>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
