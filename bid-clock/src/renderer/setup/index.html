<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>选择开标时间</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <header class="panel__head" id="head">
        <div class="panel__titles">
          <h1 class="panel__title">选择开标时间</h1>
          <p class="panel__sub" id="status">今天 · 当前 --:--:--</p>
        </div>
        <button type="button" class="panel__close" id="close" title="关闭（Esc）" aria-label="关闭">
          ✕
        </button>
      </header>

      <!-- 两个常用选项由 setup.js 按主进程给的 BID_TIMES 生成 -->
      <div class="options" id="options"></div>

      <!-- 选到「今天已经过了」的时间时在这里说一句，不用弹窗打断 -->
      <p class="panel__warn" id="warn" role="alert" hidden></p>

      <!-- 或者自己挑一个：小时 / 分钟 两个下拉 -->
      <div class="custom" id="custom">
        <div class="custom__top">
          <span class="custom__label">自定义时间</span>
          <span class="custom__hint" id="custom-hint">选好小时和分钟后点右边</span>
        </div>
        <div class="custom__controls">
          <select class="select" id="hour" aria-label="小时"></select>
          <span class="custom__colon">:</span>
          <select class="select" id="minute" aria-label="分钟"></select>
          <button type="button" class="custom__apply" id="apply">使用这个时间</button>
        </div>
      </div>

      <p class="panel__note">
        选好之后会立刻在屏幕最前端显示当前时间（时:分:秒），
        <strong>到达开标时间时自动退出</strong>，用来确认是否已经到点。
      </p>
      <div class="panel__bottom">
        <p class="panel__foot" id="foot">拖动标题栏移动窗口；悬浮钟拖右下角可等比缩放。</p>
        <span class="panel__maker" title="制作人">CAI JIAXING</span>
      </div>
    </div>
    <script src="setup.js"></script>
  </body>
</html>
