<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>开标时间</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 背景透明，只留一串时间：拖动窗口可移动，拖右下角可等比缩放 -->
    <div id="clock" class="clock" role="timer" aria-live="off" data-phase="normal" title="拖动可移动；右键打开菜单">
      <span id="digits" class="clock__digits">00:00:00</span>
    </div>
    <div id="grip" class="grip" title="拖动可等比缩放" aria-hidden="true"></div>
    <script src="clock.js"></script>
  </body>
</html>
